# nginx config for serving Sakīna's static export.
#
# Mount /opt/sakina/out as /usr/share/nginx/html in the container,
# and this file as /etc/nginx/conf.d/default.conf.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip is fine for HTML/JS/CSS/JSON. Arabic woff2 fonts are
    # already compressed; don't double-encode them.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Long-lived cache for hashed Next.js build assets. Next embeds a
    # content hash in every filename under _next/static/, so these
    # are safe to cache forever.
    location /_next/static/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Fonts live under _next/static/media/<hash>.woff2 (handled above),
    # but also catch any direct font requests.
    location ~* \.(?:woff2|woff|ttf|otf)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The pattern overlay and brand icon are not hashed but rarely
    # change — one-day cache lets us update without a deploy dance.
    location ~* \.(?:svg|png|ico)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # HTML must not be aggressively cached — content updates with each
    # deploy and we want users to see the new build on next refresh.
    location / {
        add_header Cache-Control "public, max-age=0, must-revalidate";

        # Static export with trailingSlash: true means every page lives
        # at /path/index.html. This try_files walks: exact file, then
        # folder-index, then 404.
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Quietly drop the noise.
    location = /favicon.ico { return 204; access_log off; log_not_found off; }
    location = /robots.txt  { return 200 "User-agent: *\nAllow: /\n"; }
}
