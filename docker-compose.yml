# Sakīna — static-site deployment via nginx.
#
# Expected layout on the host (CLAUDE.md §10):
#   /opt/sakina/
#   ├── docker-compose.yml      (this file)
#   ├── deploy/
#   │   └── nginx.conf          (mounted into the container)
#   └── out/                    (rsync'd from your local `npm run build`)
#
# Update workflow:
#   npm run build
#   rsync -avz --delete out/ root@<VPS>:/opt/sakina/out/
#   ssh root@<VPS> 'cd /opt/sakina && docker compose restart sakina'

services:
  sakina:
    image: nginx:1.27-alpine
    container_name: sakina
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./out:/usr/share/nginx/html:ro
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost/ || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
